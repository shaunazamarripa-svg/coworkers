name: Sync from upstream

# Pulls new commits from fayazara/coworkers into this repo once a day,
# then starts a deploy if anything changed.
on:
  schedule:
    - cron: "17 10 * * *" # daily, 10:17 UTC (~5am Central)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fayazara/coworkers.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream changes conflict with this repo. Merge upstream/main by hand."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so start the deploy explicitly.
      - name: Start deploy
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
